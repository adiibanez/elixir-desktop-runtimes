name: 'Restore Artifact Permissions'
description: 'Restore execute permissions on files after downloading GitHub artifacts'

inputs:
  path:
    description: 'Path to artifact directory'
    required: true
  type:
    description: 'Type of artifact: otp, nif, or custom'
    required: false
    default: 'otp'
  custom_patterns:
    description: 'Custom patterns to make executable (newline-separated)'
    required: false
    default: ''

outputs:
  files_fixed:
    description: 'Number of files with restored permissions'
    value: ${{ steps.restore.outputs.files_fixed }}

runs:
  using: 'composite'
  steps:
    - name: Restore execute permissions
      id: restore
      shell: bash
      env:
        ARTIFACT_PATH: ${{ inputs.path }}
        ARTIFACT_TYPE: ${{ inputs.type }}
        CUSTOM_PATTERNS: ${{ inputs.custom_patterns }}
      run: |
        cd "$ARTIFACT_PATH"
        count=0

        restore_exec() {
          local pattern="$1"
          local found=$(find . -name "$pattern" -type f 2>/dev/null)
          if [ -n "$found" ]; then
            echo "$found" | while read -r file; do
              chmod +x "$file"
              echo "  chmod +x $file"
              count=$((count + 1))
            done
          fi
        }

        echo "Restoring permissions in $ARTIFACT_PATH (type: $ARTIFACT_TYPE)"

        case "$ARTIFACT_TYPE" in
          otp)
            # OTP build tools
            echo "Restoring OTP build tool permissions..."

            # Main build scripts
            for script in otp_build configure bootstrap Install; do
              if [ -f "$script" ]; then
                chmod +x "$script"
                echo "  chmod +x $script"
                count=$((count + 1))
              fi
            done

            # Shell scripts
            find . -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null
            count=$((count + $(find . -type f -name "*.sh" 2>/dev/null | wc -l)))

            # Autoconf helpers
            for helper in config.guess config.sub install-sh; do
              find . -type f -name "$helper" -exec chmod +x {} \; 2>/dev/null
            done

            # Binary tools in bin directories
            find . -path "*/bin/*" -type f -exec chmod +x {} \; 2>/dev/null

            # Critical: yielding_c_fun (used during OTP build)
            find . -name "yielding_c_fun" -type f -exec chmod +x {} \; 2>/dev/null

            # Perl scripts
            find . -type f -name "*.pl" -exec chmod +x {} \; 2>/dev/null

            # Python scripts
            find . -type f -name "*.py" -exec chmod +x {} \; 2>/dev/null
            ;;

          nif)
            # NIF artifacts typically don't need execute permissions
            echo "NIF artifacts don't require permission restoration"
            ;;

          custom)
            # User-specified patterns
            if [ -n "$CUSTOM_PATTERNS" ]; then
              echo "Restoring custom patterns..."
              echo "$CUSTOM_PATTERNS" | while IFS= read -r pattern; do
                if [ -n "$pattern" ]; then
                  find . -name "$pattern" -type f -exec chmod +x {} \; 2>/dev/null
                  echo "  Applied pattern: $pattern"
                fi
              done
            fi
            ;;

          *)
            echo "Unknown artifact type: $ARTIFACT_TYPE"
            ;;
        esac

        # Verify critical files
        echo ""
        echo "Verification of critical executables:"
        for critical in otp_build yielding_c_fun configure; do
          found=$(find . -name "$critical" -type f 2>/dev/null | head -1)
          if [ -n "$found" ]; then
            if [ -x "$found" ]; then
              echo "  ✅ $critical is executable"
            else
              echo "  ❌ $critical is NOT executable"
              chmod +x "$found"
              echo "     Fixed: $found"
            fi
          fi
        done

        echo "files_fixed=$count" >> "$GITHUB_OUTPUT"
        echo ""
        echo "Permission restoration complete"
